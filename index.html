<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi Pengeluaran &amp; Anggaran</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <main class="app">
        <header class="topbar">
            <h1>Pengeluaran Harian</h1>
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Ganti mode gelap/terang">🌙</button>
        </header>

        <!-- Total Saldo -->
         <section class="card balance">
            <p class="label">Total Saldo</p>
            <p id="total-balance" class="amount">Rp 0</p>
         </section>

         <!-- Formulir Input -->
    <section class="card">
      <h2>Tambah Transaksi</h2>
      <form id="transaction-form" novalidate>
        <label for="item-name">Nama Item</label>
        <input id="item-name" type="text" placeholder="Contoh: Nasi goreng" autocomplete="off">

        <label for="item-amount">Jumlah (Rp)</label>
        <input id="item-amount" type="number" min="1" inputmode="numeric" placeholder="Contoh: 15000">

        <label for="item-category">Kategori</label>
        <select id="item-category"></select>

        <p id="form-error" class="error" role="alert"></p>
        <button type="submit" class="btn">Tambah</button>
      </form>

       <!-- Kategori Kustom -->
      <div class="custom-category">
        <label for="new-category">Kategori baru</label>
        <div class="row">
          <input id="new-category" type="text" placeholder="Contoh: Belanja" maxlength="20">
          <button id="add-category" class="btn btn-light" type="button">Simpan</button>
        </div>
      </div>
    </section>

    <!-- Grafik -->
    <section class="card">
      <h2>Distribusi Pengeluaran</h2>
      <div class="chart-wrap">
        <canvas id="expense-chart" aria-label="Diagram lingkaran pengeluaran per kategori" role="img"></canvas>
        <p id="chart-empty" class="empty">Belum ada data untuk ditampilkan.</p>
      </div>
    </section>



    <!-- Daftar Transaksi -->
    <section class="card">
      <div class="list-header">
        <h2>Daftar Transaksi</h2>
        <select id="sort-select" aria-label="Urutkan transaksi">
          <option value="newest">Terbaru</option>
          <option value="amount-desc">Jumlah tertinggi</option>
          <option value="amount-asc">Jumlah terendah</option>
          <option value="category">Kategori (A-Z)</option>
        </select>
      </div>
      <ul id="transaction-list" class="list"></ul>
      <p id="list-empty" class="empty">Belum ada transaksi.</p>
    </section>    
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
